# Black Friday / Cyber Monday 2026 — InfoSec & Cybersecurity Certification Deals
# Maintained by v3nomtech — https://github.com/v3nomtech/infosec-cert-black-friday-2026
#
# This file is the single source of truth. README.md and the exports in
# data/ are GENERATED from it by scripts/build.py — edit this file, not the README.
#
# Field reference
#   vendor        (required) Vendor / training provider name
#   category      (required) one of: certification | training | labs
#   offer         (required) What is discounted, in one short sentence
#   certs         (optional) List of cert / course acronyms covered
#   discount      (required) e.g. "20% off", "$2,749 → $2,199", "TBA"
#   code          (optional) Coupon code. Leave empty if auto-applied
#   starts        (optional) YYYY-MM-DD — only if the vendor publishes it
#   ends          (optional) YYYY-MM-DD (last valid day) — only if the vendor publishes it
#   url           (required) Official vendor page for the offer (no affiliate links!)
#   source        (required) vendor | third-party   — vendor = confirmed on the vendor's own site/channel
#   source_url    (optional) Where the offer was confirmed or reported, if not the url itself
#   expected      (optional) true = not announced yet (watchlist)
#   last_year     (optional) What the vendor offered around Black Friday 2025
#   notes         (optional) Exclusions, conflicts between sources, gotchas
#   featured      (optional) true = pin to the ⭐ Featured block at the top of the README (maintainer only)
#   featured_note (optional) One-line reason it's featured
#   logo          (optional) Path to a logo image in assets/logos/ (shown in the Featured block)
#   logo_dark     (optional) Logo variant for GitHub dark mode (needs logo too)
#   last_checked  (required) YYYY-MM-DD

